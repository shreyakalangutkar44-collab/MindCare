
name: mindcare

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Voice
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.0

  # UI
  cupertino_icons: ^1.0.8

  # Select photos from phone gallery/camera
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/memory_images/

